# ---------------------------------------------------------------------------
# Rate limit zones (valid here because this file is included inside http {})
#
#   chat_limit  – POST /api/chat fires 2 Anthropic API calls; tightest limit
#   auth_limit  – /api/auth/google hits Google + creates DB users
#   api_limit   – all other /api/ endpoints (DB reads/writes only)
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/m;

# Redirect bare domain (HTTP) to www
server {
    listen 80;
    server_name valenceapchem.com;
    return 301 https://www.valenceapchem.com$request_uri;
}

# Redirect www HTTP to HTTPS
server {
    listen 80;
    server_name www.valenceapchem.com;
    return 301 https://www.valenceapchem.com$request_uri;
}

# Redirect bare domain HTTPS to www
server {
    listen 443 ssl;
    server_name valenceapchem.com;
    ssl_certificate /etc/letsencrypt/live/valenceapchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valenceapchem.com/privkey.pem;
    return 301 https://www.valenceapchem.com$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    server_name www.valenceapchem.com;
    ssl_certificate /etc/letsencrypt/live/valenceapchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valenceapchem.com/privkey.pem;

    # Chat — strictest limit; each request triggers 2 Anthropic API calls
    location /api/chat {
        limit_req zone=chat_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Auth — moderate limit; hits Google token verification + DB upsert
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # All other API endpoints — general limit
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}