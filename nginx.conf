# Redirect bare domain (HTTP) to www
server {
    listen 80;
    server_name valenceapchem.com;
    return 301 https://www.valenceapchem.com$request_uri;
}

# Redirect www HTTP to HTTPS
server {
    listen 80;
    server_name www.valenceapchem.com;
    return 301 https://www.valenceapchem.com$request_uri;
}

# Redirect bare domain HTTPS to www
server {
    listen 443 ssl;
    server_name valenceapchem.com;
    ssl_certificate /etc/letsencrypt/live/valenceapchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valenceapchem.com/privkey.pem;
    return 301 https://www.valenceapchem.com$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    server_name www.valenceapchem.com;
    ssl_certificate /etc/letsencrypt/live/valenceapchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valenceapchem.com/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}